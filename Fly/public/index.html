<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FlyWire - Gerçek Konnektom Sinek Simülasyonu</title>
  <style>
    body { margin: 0; overflow: hidden; background: #0a0a0f; color: #fff; font-family: sans-serif; }
    #overlay { position: absolute; top: 15px; left: 15px; background: rgba(0,0,0,0.85); padding: 15px; border-radius: 8px; border: 1px solid #333; max-width: 300px; }
    h1 { font-size: 14px; margin: 0 0 10px; color: #00ffcc; text-transform: uppercase; }
    .neuron-status { font-family: monospace; font-size: 11px; margin-bottom: 4px; }
    .spike { color: #ff0055; font-weight: bold; }
  </style>

  <script async src="https://unpkg.com/es-module-shims@1.6.3/dist/es-module-shims.js"></script>
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="overlay">
    <h1>FlyWire v783 Connectome</h1>
    <div id="telemetry">Yükleniyor...</div>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { FlyWireConnectomeEngine } from '../src/brain_engine.js';

    // 1. Sahne Kurulumu
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 12, 15);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);

    scene.add(new THREE.AmbientLight(0x404040));
    const light = new THREE.DirectionalLight(0xffffff, 1);
    light.position.set(5, 10, 7);
    scene.add(light);

    const grid = new THREE.GridHelper(30, 30, 0x00ffcc, 0x222222);
    scene.add(grid);

    // 2. Obje Modelleri
    const flyGroup = new THREE.Group();
    const bodyMesh = new THREE.Mesh(
      new THREE.SphereGeometry(0.4, 16, 16),
      new THREE.MeshStandardMaterial({ color: 0x22aa66 })
    );
    flyGroup.add(bodyMesh);
    scene.add(flyGroup);

    const targetMesh = new THREE.Mesh(
      new THREE.SphereGeometry(0.3, 16, 16),
      new THREE.MeshBasicMaterial({ color: 0xff3300 })
    );
    targetMesh.position.set(5, 0.3, -3);
    scene.add(targetMesh);

    // 3. Veri Yükleme ve Simülasyon Başlatma
    let brainEngine = null;

    fetch('./flywire_real_subnetwork.json')
      .then(res => res.json())
      .then(data => {
        brainEngine = new FlyWireConnectomeEngine(data);
        animate();
      });

    // 4. Animasyon Döngüsü
    const clock = new THREE.Clock();
    const telemetryEl = document.getElementById('telemetry');

    function animate() {
      requestAnimationFrame(animate);
      const delta = clock.getDelta();

      if (brainEngine) {
        // Mesafeleri ölç
        const distL = flyGroup.position.distanceTo(targetMesh.position);
        const distR = distL; // Basitleştirilmiş göz mesafesi

        // Nöron ağını çalıştır
        const output = brainEngine.step(distL, distR);

        // Fiziksel Hareket
        const turn = output.motorL - output.motorR;
        const forward = (output.motorL + output.motorR) / 2;

        flyGroup.rotation.y += turn * 2.0 * delta;
        flyGroup.translateZ(forward * 3.0 * delta);

        // Telemetri Güncelleme
        let html = '';
        Object.keys(brainEngine.neurons).forEach(id => {
          const n = brainEngine.neurons[id];
          const isSpiked = output.spikes[id];
          html += `<div class="neuron-status">${n.label}: ${n.v.toFixed(1)}mV ${isSpiked ? '<span class="spike">⚡ SPIKE</span>' : ''}</div>`;
        });
        telemetryEl.innerHTML = html;
      }

      controls.update();
      renderer.render(scene, camera);
    }
  </script>
</body>
</html>
