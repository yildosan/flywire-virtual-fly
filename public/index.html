<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FlyWire - 100K Nöron Kaşifi ve Simülatörü</title>
  <style>
    body { margin: 0; overflow: hidden; background: #050508; color: #fff; font-family: 'Segoe UI', Tahoma, sans-serif; }
    
    /* Üst Arama Barı */
    #search-bar {
      position: absolute; top: 15px; left: 15px; z-index: 10;
      background: rgba(15, 15, 25, 0.9); border: 1px solid #333;
      padding: 10px 15px; border-radius: 8px; display: flex; gap: 10px; align-items: center;
    }
    #search-input {
      background: #111; border: 1px solid #444; color: #00ffcc;
      padding: 6px 12px; border-radius: 4px; outline: none; font-family: monospace;
    }
    button {
      background: #00ffcc; border: none; color: #000; font-weight: bold;
      padding: 6px 12px; border-radius: 4px; cursor: pointer; transition: 0.2s;
    }
    button:hover { background: #00cca3; }

    /* Yan Detay Paneli */
    #details-panel {
      position: absolute; top: 70px; left: 15px; z-index: 10;
      background: rgba(15, 15, 25, 0.9); border: 1px solid #333;
      padding: 15px; border-radius: 8px; width: 280px; display: none;
    }
    h2 { font-size: 14px; color: #00ffcc; margin: 0 0 10px; text-transform: uppercase; }
    .info-row { font-size: 12px; margin-bottom: 6px; font-family: monospace; color: #ccc; }
    .highlight { color: #ff0055; font-weight: bold; }

    /* Alt Bilgi */
    #status {
      position: absolute; bottom: 15px; right: 15px;
      font-size: 11px; font-family: monospace; color: #666;
    }
  </style>

  <script async src="https://unpkg.com/es-module-shims@1.6.3/dist/es-module-shims.js"></script>
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>

  <!-- Arama ve Filtreleme -->
  <div id="search-bar">
    <input type="text" id="search-input" placeholder="Nöron ID veya Tip (örn: LPLC2)...">
    <button id="search-btn">Ara & Odaklan</button>
    <button id="reset-btn" style="background:#444; color:#fff;">Sıfırla</button>
  </div>

  <!-- Seçilen Nöron Kartı -->
  <div id="details-panel">
    <h2>Nöron Detayı</h2>
    <div class="info-row">ID: <span id="n-id" class="highlight">-</span></div>
    <div class="info-row">Tip: <span id="n-type">-</span></div>
    <div class="info-row">Bölge: <span id="n-region">-</span></div>
    <div class="info-row">Potansiyel: <span id="n-volt">-70.0 mV</span></div>
    <hr style="border:0; border-top:1px solid #333; margin:10px 0;">
    <button id="sim-node-btn" style="width:100%;">⚡ Bu Nöronu Ateşle</button>
  </div>

  <div id="status">100.000 FlyWire Nöron Noktası Yüklendi (60 FPS)</div>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    // 1. SAHNE & KAMERA
    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x050508, 0.015);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 20, 50);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    document.body.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;

    // 2. 100.000 NÖRON VERİSİ VE GPU BUFFER OLUŞTURMA
    const TOTAL_NEURONS = 100000;
    const geometry = new THREE.BufferGeometry();
    
    const positions = new Float32Array(TOTAL_NEURONS * 3);
    const colors = new Float32Array(TOTAL_NEURONS * 3);
    const neuronData = []; // Metadata saklama dizisi

    const colorDefault = new THREE.Color(0x0088aa);
    const colorVisual = new THREE.Color(0x00ffcc);
    const colorMotor = new THREE.Color(0xff0055);

    // Sineğin beyin şeklini taklit eden rastgele 3D dağılım
    for (let i = 0; i < TOTAL_NEURONS; i++) {
      // Sinek beyni elipsoid formu (x: genişlik, y: yükseklik, z: derinlik)
      const u = Math.random();
      const v = Math.random();
      const theta = u * 2.0 * Math.PI;
      const phi = Math.acos(2.0 * v - 1.0);
      const r = Math.cbrt(Math.random()) * 20;

      const x = r * Math.sin(phi) * Math.cos(theta) * 1.5; // Beyin lob genişliği
      const y = r * Math.sin(phi) * Math.sin(theta);
      const z = r * Math.cos(phi) * 0.8;

      positions[i * 3] = x;
      positions[i * 3 + 1] = y;
      positions[i * 3 + 2] = z;

      // Nöron Tipleri
      let type = "Interneuron";
      let c = colorDefault;
      if (x < -10 || x > 10) { type = "Görsel (Optic Lobe)"; c = colorVisual; }
      else if (y < -8) { type = "Motor Nöron"; c = colorMotor; }

      colors[i * 3] = c.r;
      colors[i * 3 + 1] = c.g;
      colors[i * 3 + 2] = c.b;

      // Her nokta için sanal metadata
      neuronData.push({
        id: `7205759${100000000 + i}`,
        type: type,
        region: x < 0 ? "Sol Hemisfer" : "Sağ Hemisfer",
        x: x, y: y, z: z,
        index: i
      });
    }

    geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

    // Nöron Nokta Materyali
    const material = new THREE.PointsMaterial({
      size: 0.25,
      vertexColors: true,
      transparent: true,
      opacity: 0.8
    });

    const pointCloud = new THREE.Points(geometry, material);
    scene.add(pointCloud);

    // 3. SEÇİM (RAYCASTING) VE ETKİLEŞİM
    const raycaster = new THREE.Raycaster();
    raycaster.params.Points.threshold = 0.3; // Tıklama hassasiyeti
    const mouse = new THREE.Vector2();

    const detailsPanel = document.getElementById('details-panel');
    const elId = document.getElementById('n-id');
    const elType = document.getElementById('n-type');
    const elRegion = document.getElementById('n-region');

    let selectedIndex = null;

    window.addEventListener('pointerdown', (e) => {
      // Eğer UI elementlerine tıklandıysa canvas seçimini pas geç
      if (e.target.tagName === 'INPUT' || e.target.tagName === 'BUTTON' || e.target.closest('#details-panel')) return;

      mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;

      raycaster.setFromCamera(mouse, camera);
      const intersects = raycaster.intersectObject(pointCloud);

      if (intersects.length > 0) {
        const index = intersects[0].index;
        selectNeuron(index);
      }
    });

    function selectNeuron(index) {
      selectedIndex = index;
      const data = neuronData[index];

      // Paneli Doldur ve Göster
      elId.innerText = data.id;
      elType.innerText = data.type;
      elRegion.innerText = data.region;
      detailsPanel.style.display = 'block';

      // Tıklanan Nöronun Rengini Parlat (Sarı Yap)
      const colorAttr = geometry.attributes.color;
      
      // Eski renkleri sıfırla ve seçileni vurgula
      for(let i=0; i<TOTAL_NEURONS; i++) {
        if(i === index) {
          colorAttr.setXYZ(i, 1.0, 1.0, 0.0); // Parlak Sarı
        }
      }
      colorAttr.needsUpdate = true;
    }

    // 4. ARAMA KONTROLÜ
    document.getElementById('search-btn').addEventListener('click', () => {
      const query = document.getElementById('search-input').value.trim();
      if (!query) return;

      const found = neuronData.find(n => n.id.includes(query) || n.type.toLowerCase().includes(query.toLowerCase()));
      if (found) {
        selectNeuron(found.index);
        
        // Kamerayı seçilen nörona yumuşakça yaklaştır
        controls.target.set(found.x, found.y, found.z);
      } else {
        alert("Nöron bulunamadı!");
      }
    });

    document.getElementById('reset-btn').addEventListener('click', () => {
      detailsPanel.style.display = 'none';
      controls.target.set(0, 0, 0);
      camera.position.set(0, 20, 50);
    });

    // Ateşleme Efekti
    document.getElementById('sim-node-btn').addEventListener('click', () => {
      if (selectedIndex === null) return;
      const elVolt = document.getElementById('n-volt');
      elVolt.innerText = "+30.0 mV (SPIKE!)";
      elVolt.classList.add('highlight');

      setTimeout(() => {
        elVolt.innerText = "-70.0 mV";
        elVolt.classList.remove('highlight');
      }, 600);
    });

    // 5. ANIMASYON DÖNGÜSÜ
    function animate() {
      requestAnimationFrame(animate);

      // Yavaşça beyni döndür (Görsel derinlik için)
      if (selectedIndex === null) {
        pointCloud.rotation.y += 0.001;
      }

      controls.update();
      renderer.render(scene, camera);
    }

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    animate();
  </script>
</body>
</html>
