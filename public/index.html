<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FlyWire - Gerçek Konnektom Sinek Simülasyonu</title>
  <style>
    body { margin: 0; overflow: hidden; background: #0a0a0f; color: #fff; font-family: sans-serif; }
    #overlay { position: absolute; top: 15px; left: 15px; background: rgba(0,0,0,0.85); padding: 15px; border-radius: 8px; border: 1px solid #333; max-width: 320px; pointer-events: none; }
    h1 { font-size: 14px; margin: 0 0 10px; color: #00ffcc; text-transform: uppercase; }
    .neuron-status { font-family: monospace; font-size: 11px; margin-bottom: 4px; }
    .spike { color: #ff0055; font-weight: bold; }
    #instruction {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.8);
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 12px;
      color: #00ffcc;
      border: 1px solid #333;
      pointer-events: none;
    }
  </style>

  <script async src="https://unpkg.com/es-module-shims@1.6.3/dist/es-module-shims.js"></script>
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="overlay">
    <h1>FlyWire v783 Connectome</h1>
    <div id="telemetry">Yükleniyor...</div>
  </div>

  <div id="instruction">💡 Işık kaynağını fareyle basılı tutarak sürükleyebilirsiniz</div>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { FlyWireConnectomeEngine } from './brain_engine.js';

    // 1. Sahne Kurulumu
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 12, 15);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);

    scene.add(new THREE.AmbientLight(0x404040));
    const dirLight = new THREE.DirectionalLight(0xffffff, 1);
    dirLight.position.set(5, 10, 7);
    scene.add(dirLight);

    const grid = new THREE.GridHelper(30, 30, 0x00ffcc, 0x222222);
    scene.add(grid);

    // 2. Obje Modelleri
    const flyGroup = new THREE.Group();
    const bodyMesh = new THREE.Mesh(
      new THREE.SphereGeometry(0.4, 16, 16),
      new THREE.MeshStandardMaterial({ color: 0x22aa66 })
    );
    flyGroup.add(bodyMesh);
    scene.add(flyGroup);

    // 3D Sürüklenebilir Işık Kaynağı (Yem)
    const targetMesh = new THREE.Mesh(
      new THREE.SphereGeometry(0.4, 16, 16),
      new THREE.MeshBasicMaterial({ color: 0xff3300 })
    );
    const pointLight = new THREE.PointLight(0xffaa00, 3, 15);
    targetMesh.add(pointLight);
    targetMesh.position.set(5, 0.4, -3);
    scene.add(targetMesh);

    // Görünmez Zemin Düzlemi (Fareyle sürükleme takibi için)
    const dragPlane = new THREE.Mesh(
      new THREE.PlaneGeometry(100, 100),
      new THREE.MeshBasicMaterial({ visible: false })
    );
    dragPlane.rotation.x = -Math.PI / 2;
    scene.add(dragPlane);

    // 3. Fare ile Işık Sürükleme Kontrolleri
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();
    let isDragging = false;

    window.addEventListener('pointerdown', (e) => {
      mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
      
      raycaster.setFromCamera(mouse, camera);
      const intersects = raycaster.intersectObject(targetMesh);
      
      if (intersects.length > 0) {
        isDragging = true;
        controls.enabled = false;
      }
    });

    window.addEventListener('pointermove', (e) => {
      if (!isDragging) return;
      
      mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
      
      raycaster.setFromCamera(mouse, camera);
      const intersects = raycaster.intersectObject(dragPlane);
      
      if (intersects.length > 0) {
        targetMesh.position.x = intersects[0].point.x;
        targetMesh.position.z = intersects[0].point.z;
      }
    });

    window.addEventListener('pointerup', () => {
      isDragging = false;
      controls.enabled = true;
    });

    // 4. Veri Yükleme ve Simülasyon Başlatma
    let brainEngine = null;

    fetch('./flywire_real_subnetwork.json')
      .then(res => res.json())
      .then(data => {
        brainEngine = new FlyWireConnectomeEngine(data);
        animate();
      });

    // 5. Animasyon Döngüsü
    const clock = new THREE.Clock();
    const telemetryEl = document.getElementById('telemetry');

    function animate() {
      requestAnimationFrame(animate);
      const delta = clock.getDelta();

      if (brainEngine) {
        // Dynamic Sol ve Sağ Göz Mesafesi Hesaplama
        const flyPos = flyGroup.position;
        const flyAngle = flyGroup.rotation.y;

        const eyeLeftPos = new THREE.Vector3(
          flyPos.x + Math.sin(flyAngle + 0.4) * 0.4,
          0.4,
          flyPos.z + Math.cos(flyAngle + 0.4) * 0.4
        );

        const eyeRightPos = new THREE.Vector3(
          flyPos.x + Math.sin(flyAngle - 0.4) * 0.4,
          0.4,
          flyPos.z + Math.cos(flyAngle - 0.4) * 0.4
        );

        const distL = eyeLeftPos.distanceTo(targetMesh.position);
        const distR = eyeRightPos.distanceTo(targetMesh.position);

        // Nöron ağını çalıştır
        const output = brainEngine.step(distL, distR);

        // Fiziksel Hareket
        const turn = output.motorL - output.motorR;
        const forward = (output.motorL + output.motorR) / 2;

        flyGroup.rotation.y += turn * 2.0 * delta;
        flyGroup.translateZ(forward * 3.0 * delta);

        // Telemetri Güncelleme
        let html = '';
        Object.keys(brainEngine.neurons).forEach(id => {
          const n = brainEngine.neurons[id];
          const isSpiked = output.spikes[id];
          html += `<div class="neuron-status">${n.label}: ${n.v.toFixed(1)}mV ${isSpiked ? '<span class="spike">⚡ SPIKE</span>' : ''}</div>`;
        });
        telemetryEl.innerHTML = html;
      }

      controls.update();
      renderer.render(scene, camera);
    }

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
